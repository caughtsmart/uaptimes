<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-label="UAP Times">
  <title>UAP Times</title>
  <defs>
    <radialGradient id="uapSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b12a1d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#b12a1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uapDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c73a2b"/>
      <stop offset="100%" stop-color="#8c1f14"/>
    </linearGradient>
    <linearGradient id="uapDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f5ee"/>
      <stop offset="100%" stop-color="#d8d2c2"/>
    </linearGradient>
  </defs>

  <!-- ================= Emblem — declassified radar stamp ================= -->
  <g>
    <!-- stamp frame -->
    <circle cx="82" cy="76" r="66" fill="none" stroke="#b12a1d" stroke-opacity="0.30" stroke-width="1.5"/>

    <!-- radar rings -->
    <g fill="none" stroke="#b7ad96">
      <circle cx="82" cy="76" r="56" stroke-opacity="0.55"/>
      <circle cx="82" cy="76" r="40" stroke-opacity="0.55"/>
      <circle cx="82" cy="76" r="24" stroke-opacity="0.55"/>
    </g>

    <!-- crosshair -->
    <g stroke="#b7ad96" stroke-opacity="0.45" stroke-width="1">
      <line x1="82" y1="14" x2="82" y2="138"/>
      <line x1="20" y1="76" x2="144" y2="76"/>
    </g>

    <!-- radar sweep wedge — slowly rotating -->
    <g>
      <path d="M82 76 L82 20 A56 56 0 0 1 131 48 Z" fill="url(#uapSweep)"/>
      <line x1="82" y1="76" x2="82" y2="20" stroke="#b12a1d" stroke-opacity="0.5" stroke-width="1.2"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 82 76" to="360 82 76" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- blips -->
    <g fill="#b12a1d">
      <circle cx="116" cy="60" r="1.6" opacity="0.9"/>
      <circle cx="54" cy="52" r="1.2" opacity="0.7"/>
      <circle cx="120" cy="100" r="1.3" opacity="0.65"/>
    </g>

    <!-- saucer -->
    <ellipse cx="82" cy="90" rx="20" ry="3.2" fill="#8c1f14" opacity="0.28"/>
    <ellipse cx="82" cy="83" rx="30" ry="8.4" fill="url(#uapDisc)"/>
    <ellipse cx="82" cy="75" rx="15" ry="9.5" fill="url(#uapDome)"/>
    <path d="M67 75 a15 9.5 0 0 1 30 0" fill="none" stroke="#8c1f14" stroke-opacity="0.55" stroke-width="1"/>
    <!-- windows -->
    <g fill="#8c1f14">
      <circle cx="70" cy="83.5" r="1.7"/>
      <circle cx="82" cy="84.4" r="1.7"/>
      <circle cx="94" cy="83.5" r="1.7"/>
    </g>
  </g>

  <!-- ================= Wordmark ================= -->
  <g font-family="Georgia, 'Times New Roman', 'Times', serif" font-weight="700">
    <text x="176" y="90" font-size="52" letter-spacing="1.5">
      <tspan fill="#b12a1d">UAP</tspan><tspan fill="#201e18" dx="14">TIMES</tspan>
    </text>
    <line x1="178" y1="106" x2="612" y2="106" stroke="#b7ad96" stroke-width="1"/>
    <text x="179" y="125" font-family="'Courier New', ui-monospace, monospace" font-weight="700" font-size="12" letter-spacing="4.4" fill="#6a6250">FILED FROM THE EDGE OF THE KNOWN</text>
  </g>
</svg>
