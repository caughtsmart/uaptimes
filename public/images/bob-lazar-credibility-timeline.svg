<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 2060" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Timeline of the Bob Lazar story from 1959 to 2026, with each event marked as on the record, claim only, or cutting against his story">
<rect width="1120" height="2060" fill="#f7f5ee"/>
<rect x="6" y="6" width="1108" height="2048" fill="none" stroke="#b7ad96" stroke-width="1.5"/>
<rect x="12" y="12" width="1096" height="2036" fill="none" stroke="#d8d2c2" stroke-width="1"/>

<text x="48" y="58" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="4" fill="#b12a1d" font-weight="bold">CASE FILE // ROBERT SCOTT LAZAR</text>
<text x="44" y="102" font-size="44" font-weight="bold" fill="#201e18">The Lazar timeline, 1959–2026</text>
<text x="48" y="134" font-family="'Courier New', Courier, monospace" font-size="18" fill="#6a6250">What is on the record, what is claim only — and what cut against him.</text>
<line x1="44" y1="158" x2="1076" y2="158" stroke="#b7ad96" stroke-width="1.5"/>
<circle cx="58" cy="190" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="78" y="196" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="1.5" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<rect x="277.4" y="180.5" width="19" height="19" fill="#8a7a1c" stroke="#f7f5ee" stroke-width="2.5" transform="rotate(45 286.9 190)"/><text x="306.9" y="196" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="1.5" fill="#8a7a1c" font-weight="bold">CLAIM ONLY</text>
<rect x="472.9" y="181" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="501.9" y="196" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="1.5" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<line x1="252" y1="238" x2="252" y2="2008" stroke="#b7ad96" stroke-width="2.5"/>
<circle cx="252" cy="248" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="254" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">1959</text>
<text x="230" y="275" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="256" font-size="25" font-weight="bold" fill="#201e18">Robert Scott Lazar is born</text>
<text x="286" y="283" font-size="19.5" fill="#6a6250">Born 26 January in Coral Gables, Florida.</text>
<circle cx="252" cy="330" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="336" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">1976–79</text>
<text x="230" y="357" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="338" font-size="25" font-weight="bold" fill="#201e18">Pierce Junior College, Los Angeles</text>
<text x="286" y="365" font-size="19.5" fill="#6a6250">Electronics courses — the only education anyone has ever verified.</text>
<rect x="242.5" y="402.5" width="19" height="19" fill="#8a7a1c" stroke="#f7f5ee" stroke-width="2.5" transform="rotate(45 252 412)"/><text x="230" y="418" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">c. 1978–82</text>
<text x="230" y="439" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#8a7a1c" font-weight="bold">CLAIM ONLY</text>
<text x="286" y="420" font-size="25" font-weight="bold" fill="#201e18">The MIT and Caltech masters degrees</text>
<text x="286" y="447" font-size="19.5" fill="#6a6250">No records, no classmates, no thesis. Both institutions deny he was there.</text>
<circle cx="252" cy="494" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="500" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">1980–84</text>
<text x="230" y="521" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="502" font-size="25" font-weight="bold" fill="#201e18">Los Alamos — as a contractor</text>
<text x="286" y="529" font-size="19.5" fill="#6a6250">Works around the Meson Physics Facility for Kirk-Mayer, a staffing subcontractor;</text>
<text x="286" y="553" font-size="19.5" fill="#6a6250">listed in the 1982 lab phone directory with a "K/M" annotation.</text>
<circle cx="252" cy="600" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="606" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Jun 1982</text>
<text x="230" y="627" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="608" font-size="25" font-weight="bold" fill="#201e18">The jet car makes the front page</text>
<text x="286" y="635" font-size="19.5" fill="#6a6250">The Los Alamos Monitor calls him "a physicist at the Los Alamos Meson Physics</text>
<text x="286" y="659" font-size="19.5" fill="#6a6250">Facility". The same year, he is photographed with Edward Teller.</text>
<rect x="243" y="697" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="712" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">1986</text>
<text x="230" y="733" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<text x="286" y="714" font-size="25" font-weight="bold" fill="#201e18">Bankruptcy in Las Vegas</text>
<text x="286" y="741" font-size="19.5" fill="#6a6250">The court paperwork lists his occupation as a self-employed film processor —</text>
<text x="286" y="765" font-size="19.5" fill="#6a6250">not a physicist.</text>
<rect x="242.5" y="802.5" width="19" height="19" fill="#8a7a1c" stroke="#f7f5ee" stroke-width="2.5" transform="rotate(45 252 812)"/><text x="230" y="818" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Dec 1988–Apr 1989</text>
<text x="230" y="839" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#8a7a1c" font-weight="bold">CLAIM ONLY</text>
<text x="286" y="820" font-size="25" font-weight="bold" fill="#201e18">The S-4 story</text>
<text x="286" y="847" font-size="19.5" fill="#6a6250">Recruited via EG&amp;G, he says, to reverse-engineer a saucer’s antimatter reactor</text>
<text x="286" y="871" font-size="19.5" fill="#6a6250">at a hidden site near Papoose Lake. No document has ever surfaced.</text>
<circle cx="252" cy="918" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="924" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Mar–Apr 1989</text>
<text x="230" y="945" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="926" font-size="25" font-weight="bold" fill="#201e18">The Groom Lake Road trips</text>
<text x="286" y="953" font-size="19.5" fill="#6a6250">Takes friends to watch Wednesday-night lights; on the third trip the group is</text>
<text x="286" y="977" font-size="19.5" fill="#6a6250">stopped by base security — an incident that genuinely happened.</text>
<circle cx="252" cy="1024" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1030" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">May 1989</text>
<text x="230" y="1051" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="1032" font-size="25" font-weight="bold" fill="#201e18">"Dennis" appears in silhouette</text>
<text x="286" y="1059" font-size="19.5" fill="#6a6250">George Knapp interviews an anonymous Lazar on Las Vegas station KLAS-TV.</text>
<circle cx="252" cy="1106" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1112" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Nov 1989</text>
<text x="230" y="1133" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="1114" font-size="25" font-weight="bold" fill="#201e18">Lazar goes public</text>
<text x="286" y="1141" font-size="19.5" fill="#6a6250">Name and face, across a week of George Knapp’s KLAS-TV evening news reports.</text>
<rect x="243" y="1179" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1194" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Jun 1990</text>
<text x="230" y="1215" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<text x="286" y="1196" font-size="25" font-weight="bold" fill="#201e18">Felony pandering conviction</text>
<text x="286" y="1223" font-size="19.5" fill="#6a6250">Pleads guilty over his role in a Las Vegas brothel: suspended sentence,</text>
<text x="286" y="1247" font-size="19.5" fill="#6a6250">probation and 150 hours of community service.</text>
<rect x="243" y="1285" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1300" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">1990s</text>
<text x="230" y="1321" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<text x="286" y="1302" font-size="25" font-weight="bold" fill="#201e18">The credential checks come back empty</text>
<text x="286" y="1329" font-size="19.5" fill="#6a6250">Nuclear physicist Stanton Friedman finds no trace of Lazar at MIT or Caltech —</text>
<text x="286" y="1353" font-size="19.5" fill="#6a6250">and Pierce College records that overlap his claimed Cambridge years.</text>
<rect x="243" y="1391" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1406" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">2003</text>
<text x="230" y="1427" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<text x="286" y="1408" font-size="25" font-weight="bold" fill="#201e18">Element 115 is synthesised</text>
<text x="286" y="1435" font-size="19.5" fill="#6a6250">Dubna and Livermore make moscovium. Every isotope decays in under a second —</text>
<text x="286" y="1459" font-size="19.5" fill="#6a6250">nothing like the stable 500 lb fuel Lazar described.</text>
<rect x="243" y="1497" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1512" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">2006–07</text>
<text x="230" y="1533" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<text x="286" y="1514" font-size="25" font-weight="bold" fill="#201e18">United Nuclear breaks federal law</text>
<text x="286" y="1541" font-size="19.5" fill="#6a6250">Lazar’s company pleads guilty to shipping restricted chemicals; fined and</text>
<text x="286" y="1565" font-size="19.5" fill="#6a6250">put on probation.</text>
<circle cx="252" cy="1612" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1618" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Dec 2018</text>
<text x="230" y="1639" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="1620" font-size="25" font-weight="bold" fill="#201e18">The Corbell documentary</text>
<text x="286" y="1647" font-size="19.5" fill="#6a6250">Jeremy Corbell’s "Bob Lazar: Area 51 &amp; Flying Saucers" lands on Netflix.</text>
<circle cx="252" cy="1694" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1700" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Jun 2019</text>
<text x="230" y="1721" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="1702" font-size="25" font-weight="bold" fill="#201e18">Joe Rogan Experience #1315</text>
<text x="286" y="1729" font-size="19.5" fill="#6a6250">Tens of millions of views put Lazar in front of a second generation.</text>
<rect x="243" y="1767" width="18" height="18" fill="#b12a1d" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1782" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">Mar 2024</text>
<text x="230" y="1803" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#b12a1d" font-weight="bold">CUTS AGAINST</text>
<text x="286" y="1784" font-size="25" font-weight="bold" fill="#201e18">AARO’s historical review</text>
<text x="286" y="1811" font-size="19.5" fill="#6a6250">The Pentagon’s UAP office reports no evidence any US reverse-engineering</text>
<text x="286" y="1835" font-size="19.5" fill="#6a6250">programme of alien craft has ever existed.</text>
<circle cx="252" cy="1882" r="10" fill="#2e6cab" stroke="#f7f5ee" stroke-width="2.5"/><text x="230" y="1888" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="19.5" font-weight="bold" fill="#201e18">2026</text>
<text x="230" y="1909" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="1.2" fill="#2e6cab" font-weight="bold">ON THE RECORD</text>
<text x="286" y="1890" font-size="25" font-weight="bold" fill="#201e18">Thirty-seven years on</text>
<text x="286" y="1917" font-size="19.5" fill="#6a6250">No craft, no paperwork, no second S-4 insider on the record — and Lazar</text>
<text x="286" y="1941" font-size="19.5" fill="#6a6250">has not budged an inch.</text>
<line x1="44" y1="2016" x2="1076" y2="2016" stroke="#d8d2c2" stroke-width="1"/>
<text x="48" y="2040" font-family="'Courier New', Courier, monospace" font-size="14.5" fill="#6a6250">UAP TIMES · CASE FILE GRAPHIC — sources: KLAS-TV, Los Alamos Monitor, court records, JINR/LLNL, AARO.</text>
</svg>
