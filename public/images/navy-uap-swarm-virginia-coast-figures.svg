<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Chart of the AARO FY2025 UAP report figures: 319 reports split 274 air, 44 space and 1 maritime; 114 resolved and 205 still open, of which 9 were flagged for further analysis">
<rect width="1120" height="1080" fill="#f7f5ee"/>
<rect x="6" y="6" width="1108" height="1068" fill="none" stroke="#b7ad96" stroke-width="1.5"/>
<rect x="12" y="12" width="1096" height="1056" fill="none" stroke="#d8d2c2" stroke-width="1"/>

<text x="48" y="58" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="4" fill="#b12a1d" font-weight="bold">CASE FILE // AARO FY2025</text>
<text x="44" y="104" font-size="42" font-weight="bold" fill="#201e18">One year of UAP reporting, by the numbers</text>
<text x="48" y="138" font-family="'Courier New', Courier, monospace" font-size="17" fill="#6a6250">319 reports received, 2 June 2024 – 30 May 2025. Where they came from, and what became of them.</text>
<line x1="44" y1="162" x2="1076" y2="162" stroke="#b7ad96" stroke-width="1.5"/>

<!-- Panel A: domain -->
<text x="48" y="212" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="2.5" fill="#b12a1d" font-weight="bold">01 — WHICH DOMAIN THEY CAME FROM</text>

<text x="286" y="268" text-anchor="end" font-size="25" font-weight="bold" fill="#201e18">Air</text>
<rect x="300" y="245" width="700" height="34" fill="#2e6cab"/>
<text x="1016" y="269" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#201e18">274</text>

<text x="286" y="328" text-anchor="end" font-size="25" font-weight="bold" fill="#201e18">Space</text>
<rect x="300" y="305" width="112" height="34" fill="#2e6cab"/>
<text x="428" y="329" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#201e18">44</text>
<text x="480" y="329" font-size="19.5" fill="#6a6250">42 of them from civilian pilots — resolved as satellite glint</text>

<text x="286" y="388" text-anchor="end" font-size="25" font-weight="bold" fill="#b12a1d">Maritime</text>
<rect x="300" y="365" width="4" height="34" fill="#b12a1d"/>
<text x="320" y="389" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#b12a1d">1</text>
<text x="350" y="389" font-size="19.5" fill="#b12a1d" font-weight="bold">the Virginia event — ~100 airborne objects and 2 uncrewed boats</text>
<text x="350" y="414" font-size="18" fill="#6a6250">One report. The largest single object count in the document.</text>

<line x1="44" y1="452" x2="1076" y2="452" stroke="#d8d2c2" stroke-width="1"/>

<!-- Panel B: disposition -->
<text x="48" y="502" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="2.5" fill="#b12a1d" font-weight="bold">02 — WHAT BECAME OF THE 319</text>

<rect x="300" y="536" width="250" height="46" fill="#2e6cab"/>
<rect x="550" y="536" width="430" height="46" fill="#8a7a1c"/>
<rect x="980" y="536" width="20" height="46" fill="#b12a1d"/>
<rect x="300" y="536" width="700" height="46" fill="none" stroke="#f7f5ee" stroke-width="1"/>

<text x="286" y="566" text-anchor="end" font-size="21" fill="#6a6250">all reports</text>

<circle cx="60" cy="632" r="9" fill="#2e6cab"/>
<text x="82" y="639" font-size="22" font-weight="bold" fill="#201e18">114 resolved</text>
<text x="82" y="664" font-size="17.5" fill="#6a6250">balloons, birds, satellites, drones</text>

<circle cx="400" cy="632" r="9" fill="#8a7a1c"/>
<text x="422" y="639" font-size="22" font-weight="bold" fill="#201e18">205 still open</text>
<text x="422" y="664" font-size="17.5" fill="#6a6250">awaiting data, mostly</text>

<circle cx="740" cy="632" r="9" fill="#b12a1d"/>
<text x="762" y="639" font-size="22" font-weight="bold" fill="#201e18">9 flagged</text>
<text x="762" y="664" font-size="17.5" fill="#6a6250">for further scientific analysis</text>

<line x1="44" y1="704" x2="1076" y2="704" stroke="#d8d2c2" stroke-width="1"/>

<!-- Panel C: the backlog -->
<text x="48" y="754" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="2.5" fill="#b12a1d" font-weight="bold">03 — AND THE BACKLOG BEHIND IT</text>

<text x="48" y="800" font-size="25" font-weight="bold" fill="#201e18">256 older cases closed in the same period</text>
<text x="48" y="832" font-size="19.5" fill="#6a6250">Of those, 238 were resolved in one go as satellite flaring, using a new analytical capability.</text>
<text x="48" y="860" font-size="19.5" fill="#6a6250">A single method cleared more of the file than a year of fresh reporting produced.</text>

<rect x="48" y="890" width="1024" height="6" fill="#d8d2c2"/>
<rect x="48" y="890" width="952" height="6" fill="#2e6cab"/>
<text x="48" y="928" font-family="'Courier New', Courier, monospace" font-size="17" fill="#6a6250">238 of 256 — 93% cleared by one explanation</text>

<line x1="44" y1="962" x2="1076" y2="962" stroke="#b7ad96" stroke-width="1.5"/>
<text x="48" y="1000" font-size="18.5" fill="#6a6250">AARO states it has found no verifiable evidence of extraterrestrial or breakthrough technology.</text>
<text x="48" y="1028" font-size="18.5" fill="#6a6250">The report was published in July 2026 — months after the statutory cycle Congress had in mind.</text>
<text x="1072" y="1052" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="2" fill="#b7ad96">UAP TIMES — SOURCE: AARO FY2025 CONSOLIDATED ANNUAL REPORT</text>
</svg>
