<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Night sky over a dark horizon with a distant hovering light">
  <defs>
    <!-- Deep space to horizon gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#05070c"/>
      <stop offset="55%" stop-color="#080b12"/>
      <stop offset="82%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0d1119"/>
    </linearGradient>

    <!-- Faint horizon haze -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a2740" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22344f" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Milky Way band tint -->
    <linearGradient id="milkyway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3a4a6b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5a6a90" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a4a6b" stop-opacity="0"/>
    </linearGradient>

    <!-- UAP glow -->
    <radialGradient id="uap" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#cfe8ff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#8fc4ff" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#4ade9c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4ade9c" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="600" fill="url(#sky)"/>

  <!-- Milky Way band, blurred diagonal -->
  <g filter="url(#softer)" opacity="0.8">
    <ellipse cx="820" cy="230" rx="900" ry="120" fill="url(#milkyway)" transform="rotate(-18 820 230)"/>
  </g>

  <!-- Starfield -->
  <g fill="#ffffff">
    <circle cx="120" cy="70"  r="1.1" opacity="0.85"/>
    <circle cx="260" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="340" cy="60"  r="1.4" opacity="0.9"/>
    <circle cx="410" cy="200" r="0.7" opacity="0.45"/>
    <circle cx="500" cy="110" r="1.0" opacity="0.7"/>
    <circle cx="560" cy="40"  r="0.9" opacity="0.6"/>
    <circle cx="640" cy="170" r="1.3" opacity="0.85"/>
    <circle cx="720" cy="90"  r="0.7" opacity="0.5"/>
    <circle cx="805" cy="150" r="1.6" opacity="0.95"/>
    <circle cx="880" cy="55"  r="0.8" opacity="0.55"/>
    <circle cx="960" cy="130" r="1.1" opacity="0.75"/>
    <circle cx="1040" cy="80"  r="0.9" opacity="0.6"/>
    <circle cx="1120" cy="190" r="1.2" opacity="0.8"/>
    <circle cx="1200" cy="60"  r="0.7" opacity="0.5"/>
    <circle cx="1280" cy="140" r="1.4" opacity="0.9"/>
    <circle cx="1360" cy="90"  r="0.8" opacity="0.55"/>
    <circle cx="1440" cy="180" r="1.0" opacity="0.7"/>
    <circle cx="1520" cy="70"  r="1.2" opacity="0.8"/>
    <circle cx="70"  cy="230" r="0.7" opacity="0.4"/>
    <circle cx="200" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="380" cy="270" r="0.6" opacity="0.35"/>
    <circle cx="470" cy="330" r="1.0" opacity="0.55"/>
    <circle cx="600" cy="290" r="0.7" opacity="0.4"/>
    <circle cx="760" cy="250" r="0.8" opacity="0.5"/>
    <circle cx="900" cy="310" r="0.6" opacity="0.35"/>
    <circle cx="1080" cy="270" r="0.9" opacity="0.5"/>
    <circle cx="1240" cy="320" r="0.7" opacity="0.4"/>
    <circle cx="1420" cy="280" r="1.0" opacity="0.55"/>
    <circle cx="1550" cy="240" r="0.6" opacity="0.35"/>
    <circle cx="30"  cy="120" r="0.9" opacity="0.6"/>
    <circle cx="1580" cy="130" r="0.8" opacity="0.5"/>
  </g>

  <!-- Distant hovering UAP light, low on the horizon -->
  <g>
    <ellipse cx="1050" cy="360" rx="150" ry="150" fill="url(#uap)"/>
    <ellipse cx="1050" cy="360" rx="34" ry="10" fill="#e8f6ff" opacity="0.9" filter="url(#soft)"/>
    <ellipse cx="1050" cy="360" rx="9" ry="4" fill="#ffffff" opacity="0.95"/>
    <!-- faint downward light haze -->
    <polygon points="1010,362 1090,362 1140,560 960,560" fill="#8fc4ff" opacity="0.06" filter="url(#soft)"/>
  </g>

  <!-- Dark horizon / ground silhouette -->
  <rect x="0" y="470" width="1600" height="130" fill="#04060a"/>
  <path d="M0,470 L180,462 L360,472 L560,458 L820,468 L1080,455 L1320,470 L1600,460 L1600,600 L0,600 Z" fill="#020407"/>
  <rect x="0" y="430" width="1600" height="60" fill="url(#haze)"/>
</svg>
